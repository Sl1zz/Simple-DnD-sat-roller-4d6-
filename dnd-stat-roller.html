<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ability Score Forge</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital@0;1&display=swap');

  :root{
    --parchment:#e8dcc0;
    --parchment-dark:#d4c29a;
    --ink:#2a1d0f;
    --ember:#a8331f;
    --ember-glow:#d4552e;
    --gold:#b8893a;
    --shadow:rgba(40,25,10,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:'EB Garamond',serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 10%, rgba(184,137,58,.18), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(168,51,31,.15), transparent 45%),
      #1a120a;
    display:flex;flex-direction:column;align-items:center;
    padding:2.5rem 1rem 4rem;
  }
  .board{
    width:100%;max-width:820px;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(120,90,40,.04) 29px),
      linear-gradient(160deg,var(--parchment),var(--parchment-dark));
    border:1px solid #8a6d3a;
    border-radius:6px;
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 60px rgba(120,80,30,.25);
    padding:2.5rem 2rem 3rem;
    position:relative;
  }
  .board::before,.board::after{
    content:"❖";position:absolute;color:var(--gold);font-size:1.2rem;opacity:.6;
  }
  .board::before{top:.6rem;left:.8rem}
  .board::after{bottom:.6rem;right:.8rem}

  h1{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:clamp(1.8rem,5vw,2.8rem);text-align:center;
    color:var(--ember);letter-spacing:1px;
    text-shadow:1px 1px 0 rgba(255,240,210,.4);
  }
  .sub{text-align:center;font-style:italic;color:#5c4528;margin:.4rem 0 1.4rem;font-size:1.05rem}

  .mode-toggle{
    display:flex;justify-content:center;align-items:center;gap:.8rem;
    margin-bottom:1.4rem;font-size:.95rem;color:#5c4528;
  }
  .switch{position:relative;display:inline-block;width:54px;height:28px}
  .switch input{opacity:0;width:0;height:0}
  .slider{
    position:absolute;cursor:pointer;inset:0;
    background:#8a6d3a;border-radius:28px;transition:.2s;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.3);
  }
  .slider::before{
    content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;
    background:linear-gradient(180deg,#f3ead2,#c9b27e);
    border-radius:50%;transition:.2s;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  input:checked + .slider{background:var(--ember)}
  input:checked + .slider::before{transform:translateX(26px)}
  .mode-label b{font-family:'Cinzel Decorative',serif;color:var(--ember)}

  .controls{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
  button{
    font-family:'Cinzel Decorative',serif;font-weight:700;
    cursor:pointer;border:none;border-radius:4px;
    padding:.85rem 1.6rem;font-size:.95rem;letter-spacing:.5px;
    transition:transform .12s, filter .12s;
  }
  .roll-btn{
    background:linear-gradient(180deg,var(--ember-glow),var(--ember));
    color:#fff6e8;box-shadow:0 4px 0 #7c2415, 0 8px 14px var(--shadow);
  }
  .roll-btn:hover{filter:brightness(1.08)}
  .roll-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7c2415}
  .clear-btn, .save-btn{
    background:linear-gradient(180deg,#c9b27e,var(--parchment-dark));
    color:var(--ink);box-shadow:0 4px 0 #8a6d3a, 0 8px 14px var(--shadow);
  }
  .save-btn{
    background:linear-gradient(180deg,#d4b766,#b8893a);color:#fff6e8;
    box-shadow:0 4px 0 #7a5a22, 0 8px 14px var(--shadow);
  }
  .save-btn:active, .clear-btn:active{transform:translateY(3px)}
  .save-btn:disabled{filter:grayscale(.6) brightness(.85);cursor:not-allowed}

  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem}
  .score-card{
    background:linear-gradient(165deg,#f3ead2,#dcc99c);
    border:1px solid #9b7c44;border-radius:6px;
    padding:1.1rem .8rem;text-align:center;
    box-shadow:inset 0 1px 3px rgba(255,255,255,.5), 0 4px 10px var(--shadow);
    opacity:0;transform:translateY(12px);
  }
  .score-card.show{animation:rise .5s forwards}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .total{
    font-family:'Cinzel Decorative',serif;font-weight:900;
    font-size:2.6rem;line-height:1;color:var(--ember);
    text-shadow:1px 1px 0 rgba(255,245,220,.5);
  }
  .rolls{font-size:.9rem;color:#6b5230;margin-top:.5rem;font-style:italic}
  .rolls .drop{text-decoration:line-through;opacity:.5}
  .rolls .one{color:var(--ember);font-weight:bold}
  .modifier{margin-top:.4rem;font-size:.95rem;color:#4a3a20}
  .modifier b{color:var(--gold)}

  .summary{
    text-align:center;margin-top:1.8rem;font-size:1.1rem;
    color:#5c4528;min-height:1.5rem;
  }
  .summary b{color:var(--ember);font-family:'Cinzel Decorative',serif}

  .history{margin-top:2.5rem;border-top:1px dashed #8a6d3a;padding-top:1.5rem}
  .history-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem;
  }
  .history-head h2{
    font-family:'Cinzel Decorative',serif;font-weight:700;
    color:var(--ember);font-size:1.3rem;
  }
  .history-clear{
    font-family:'EB Garamond',serif;font-style:italic;
    background:transparent;color:#7a6038;font-size:.9rem;
    padding:.3rem .6rem;box-shadow:none;
    text-decoration:underline;
  }
  .history-clear:hover{color:var(--ember)}
  .history-empty{font-style:italic;color:#7a6038;text-align:center;padding:1rem}
  .history-entry{
    background:rgba(243,234,210,.5);
    border:1px solid #b89d5c;border-radius:4px;
    padding:.8rem 1rem;margin-bottom:.7rem;
    display:grid;grid-template-columns:auto 1fr auto auto;gap:1rem;align-items:center;
  }
  .history-meta{font-size:.82rem;color:#6b5230;font-style:italic;white-space:nowrap}
  .history-meta .tag{
    display:inline-block;background:var(--ember);color:#fff6e8;
    font-style:normal;font-size:.7rem;padding:1px 6px;border-radius:3px;
    margin-left:.3rem;letter-spacing:.3px;
  }
  .history-meta .tag.plain{background:#8a6d3a}
  .history-scores{
    font-family:'Cinzel Decorative',serif;font-weight:700;
    color:var(--ink);font-size:1.05rem;letter-spacing:1px;
  }
  .history-total{font-size:.95rem;color:#5c4528;white-space:nowrap}
  .history-total b{color:var(--ember);font-family:'Cinzel Decorative',serif;font-size:1.1rem}
  .history-delete{
    background:transparent;color:#8a6d3a;font-size:1.1rem;
    padding:.2rem .5rem;box-shadow:none;
  }
  .history-delete:hover{color:var(--ember)}

  .note{text-align:center;font-size:.82rem;color:#7a6038;margin-top:1.5rem;font-style:italic}
  @media (max-width:540px){
    .history-entry{grid-template-columns:1fr auto;grid-auto-flow:row}
    .history-meta{grid-column:1/-1}
  }
</style>
</head>
<body>
  <div class="board">
    <h1>Ability Score Forge</h1>
    <p class="sub" id="sub">4d6 · reroll 1s · drop the lowest</p>

    <div class="mode-toggle">
      <span class="mode-label">Plain 4d6</span>
      <label class="switch">
        <input type="checkbox" id="rerollToggle" checked onchange="updateMode()">
        <span class="slider"></span>
      </label>
      <span class="mode-label"><b>Reroll 1s</b></span>
    </div>

    <div class="controls">
      <button class="roll-btn" onclick="rollAll()">⚔ Roll Scores</button>
      <button class="save-btn" id="saveBtn" onclick="saveCurrent()" disabled>📜 Save Roll</button>
      <button class="clear-btn" onclick="clearScores()">Clear</button>
    </div>

    <div class="scores" id="scores"></div>
    <div class="summary" id="summary"></div>

    <div class="history">
      <div class="history-head">
        <h2>Chronicle of Rolls</h2>
        <button class="history-clear" onclick="clearHistory()">clear all</button>
      </div>
      <div id="historyList"></div>
    </div>

    <p class="note">Saved rolls persist in your browser's local storage.</p>
  </div>

<script>
  const STORAGE_KEY = 'dnd_roll_history_v1';
  let currentRoll = null; // holds latest set so it can be saved

  function d6(){ return Math.floor(Math.random()*6)+1; }

  function rollScore(rerollOnes){
    const dice = [];
    for(let i=0;i<4;i++){
      let v = d6();
      let rerolled = false;
      if(rerollOnes && v === 1){ v = d6(); rerolled = true; }
      dice.push({value:v, rerolled});
    }
    const minIdx = dice.reduce((m,d,i,a)=> d.value < a[m].value ? i : m, 0);
    const kept = dice.filter((_,i)=> i!==minIdx);
    const total = kept.reduce((s,d)=> s+d.value, 0);
    return {dice, droppedIdx:minIdx, total};
  }

  function modifier(score){
    const m = Math.floor((score-10)/2);
    return (m>=0?'+':'') + m;
  }

  function updateMode(){
    const reroll = document.getElementById('rerollToggle').checked;
    document.getElementById('sub').textContent =
      reroll ? '4d6 · reroll 1s · drop the lowest' : '4d6 · drop the lowest';
  }

  function rollAll(){
    const reroll = document.getElementById('rerollToggle').checked;
    const container = document.getElementById('scores');
    container.innerHTML = '';
    const scores = [];

    for(let s=0;s<6;s++){
      const r = rollScore(reroll);
      scores.push(r.total);

      const diceHtml = r.dice.map((d,i)=>{
        const cls = [];
        if(i===r.droppedIdx) cls.push('drop');
        if(d.rerolled) cls.push('one');
        return `<span class="${cls.join(' ')}">${d.value}</span>`;
      }).join(' ');

      const card = document.createElement('div');
      card.className = 'score-card show';
      card.style.animationDelay = (s*0.08)+'s';
      card.innerHTML = `
        <div class="total">${r.total}</div>
        <div class="rolls">${diceHtml}</div>
        <div class="modifier">mod <b>${modifier(r.total)}</b></div>`;
      container.appendChild(card);
    }

    const sum = scores.reduce((a,b)=>a+b,0);
    document.getElementById('summary').innerHTML =
      `Total: <b>${sum}</b> &nbsp;·&nbsp; Average: <b>${(sum/6).toFixed(1)}</b>`;

    currentRoll = { scores, total:sum, reroll, timestamp:Date.now() };
    document.getElementById('saveBtn').disabled = false;
  }

  function clearScores(){
    document.getElementById('scores').innerHTML = '';
    document.getElementById('summary').innerHTML = '';
    currentRoll = null;
    document.getElementById('saveBtn').disabled = true;
  }

  // ---- history (localStorage) ----
  function loadHistory(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch{ return []; }
  }
  function writeHistory(h){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  }

  function saveCurrent(){
    if(!currentRoll) return;
    const h = loadHistory();
    h.unshift({...currentRoll, id:Date.now()+Math.random()});
    writeHistory(h);
    renderHistory();
    document.getElementById('saveBtn').disabled = true;
  }

  function deleteEntry(id){
    writeHistory(loadHistory().filter(e=>e.id!==id));
    renderHistory();
  }

  function clearHistory(){
    if(loadHistory().length===0) return;
    if(!confirm('Clear all saved rolls?')) return;
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  }

  function fmtTime(ts){
    const d = new Date(ts);
    return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  }

  function renderHistory(){
    const list = document.getElementById('historyList');
    const h = loadHistory();
    if(h.length===0){
      list.innerHTML = '<div class="history-empty">no rolls saved yet — forge some scores above</div>';
      return;
    }
    list.innerHTML = h.map(e=>{
      const sorted = [...e.scores].sort((a,b)=>b-a);
      const tag = e.reroll
        ? '<span class="tag">reroll 1s</span>'
        : '<span class="tag plain">plain</span>';
      return `
        <div class="history-entry">
          <div class="history-meta">${fmtTime(e.timestamp)} ${tag}</div>
          <div class="history-scores">${sorted.join(' · ')}</div>
          <div class="history-total">sum <b>${e.total}</b></div>
          <button class="history-delete" onclick="deleteEntry(${e.id})" title="delete">✕</button>
        </div>`;
    }).join('');
  }

  renderHistory();
</script>
</body>
</html>
